<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>出席登録</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f5f5f7;--surface:#fff;--text:#1c1c1e;--text-sub:#6c6c70;--border:#e5e5ea;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.08);--green:#34c759;--red:#ff3b30;--gray:#aeaeb2}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 0;position:sticky;top:0;z-index:10}header h1{font-size:17px;font-weight:700;margin-bottom:4px}header .who{font-size:12px;color:var(--text-sub);margin-bottom:12px}.classroom-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.classroom-tabs::-webkit-scrollbar{display:none}.tab-btn{flex-shrink:0;padding:7px 16px;border-radius:20px 20px 0 0;border:2px solid transparent;border-bottom:none;font-size:13px;font-weight:600;cursor:pointer;background:#f0f0f5;color:var(--text-sub);transition:all .2s;white-space:nowrap}.tab-btn.active{background:var(--surface);color:var(--text);border-color:var(--tab-color,#4a90d9);border-bottom-color:var(--surface)}.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tab-color,#4a90d9);margin-right:5px;vertical-align:middle}main{padding:16px;max-width:480px;margin:0 auto}.classroom-info{background:var(--surface);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}.classroom-color-bar{width:4px;height:36px;border-radius:4px;flex-shrink:0}.classroom-info-text .name{font-weight:700;font-size:15px}.classroom-info-text .desc{font-size:12px;color:var(--text-sub);margin-top:2px}.calendar-card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cal-nav button{width:34px;height:34px;border:1px solid var(--border);background:var(--bg);border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}.cal-title{font-weight:700;font-size:16px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal-day-label{text-align:center;font-size:11px;font-weight:600;color:var(--text-sub);padding:4px 0 8px}.cal-day-label.sun{color:#ff3b30}.cal-day-label.sat{color:#007aff}.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:13px;font-weight:500;cursor:default;position:relative;transition:all .15s;gap:2px}.cal-cell.empty{visibility:hidden}.cal-cell.class-day{cursor:pointer;font-weight:700;border:2px solid var(--classroom-color,#4a90d9);color:var(--classroom-color,#4a90d9)}.cal-cell.registered{background:var(--classroom-color,#4a90d9);color:#fff;border-color:var(--classroom-color,#4a90d9)}.cal-cell.absent{background:#f0f0f5;border-style:solid;color:var(--gray);border-color:var(--gray)}.cal-cell.deadline-passed{cursor:default;opacity:.55;border-style:dashed}.cal-cell.past{cursor:default;opacity:.35;border-color:var(--gray);color:var(--gray)}.cal-cell.today::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor}.cal-cell .check-mark{font-size:10px;line-height:1}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-sub)}.legend-swatch{width:16px;height:16px;border-radius:5px;flex-shrink:0}.note{font-size:12px;color:var(--text-sub);text-align:center;padding-bottom:8px;line-height:1.7}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal-overlay.hidden{display:none}.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:slideUp .25s ease-out}@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}.modal h3{font-size:16px;font-weight:700;margin-bottom:8px}.modal p{font-size:14px;color:var(--text-sub);margin-bottom:20px;line-height:1.6;white-space:pre-line}.modal-actions{display:grid;gap:10px}.btn{padding:13px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;width:100%}.btn:active{opacity:.7}.btn-cancel{background:var(--border);color:var(--text)}.btn-confirm{background:var(--green);color:#fff}.btn-absent{background:#fff;color:var(--text-sub);border:1.5px solid var(--border)}.btn-danger{background:var(--red);color:#fff}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.ch{padding:18px 8px;border-radius:14px;border:2px solid;cursor:pointer;font-size:18px;font-weight:700;line-height:1.4;text-align:center;transition:all .15s}.ch .sub{display:block;font-size:11px;font-weight:600;margin-top:4px;opacity:.85}.ch-attend{background:#f1fbf4;border-color:#34c759;color:#1f8a4c}.ch-absent{background:#fff5f4;border-color:#ff6b60;color:#d13c30}.ch-attend.on{background:#34c759;border-color:#34c759;color:#fff;box-shadow:0 3px 10px rgba(52,199,89,.35)}.ch-absent.on{background:#ff3b30;border-color:#ff3b30;color:#fff;box-shadow:0 3px 10px rgba(255,59,48,.3)}.state{font-size:13px;font-weight:700;text-align:center;padding:10px;border-radius:10px;background:#f0f0f5;color:var(--text-sub);margin-bottom:14px}.state.attend{background:#e8f8ee;color:#1f8a4c}.state.absent{background:#ffecea;color:#d13c30}.linkbtn{display:block;width:100%;background:none;border:none;color:#8e8e93;font-size:13px;text-decoration:underline;cursor:pointer;padding:12px 0}.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}.notice{background:#fff8e1;border:1px solid #ffe082;border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#7a5900;line-height:1.7;margin-bottom:16px}</style></head><body><header><h1>📅 出席登録</h1><div class="who" id="who"></div><div class="classroom-tabs" id="tabs"></div></header><main><div id="notice"></div><div class="classroom-info" id="classroom-info"></div><div class="calendar-card"><div class="cal-nav"><button data-mv="-1" aria-label="前の月">‹</button><span id="cal-title" class="cal-title"></span><button data-mv="1" aria-label="次の月">›</button></div><div class="cal-grid" id="cal-grid"></div></div><div class="legend"><div class="legend-item"><div class="legend-swatch" id="lg1"></div><span>授業日（登録可）</span></div><div class="legend-item"><div class="legend-swatch" id="lg2"></div><span>出席 ✓</span></div><div class="legend-item"><div class="legend-swatch" style="background:#f0f0f5;border:2px solid #aeaeb2"></div><span>欠席</span></div><div class="legend-item"><div class="legend-swatch" style="background:#f0f0f5;border:2px dashed #aaa"></div><span>締切済み</span></div></div><p class="note">授業の3日前17:00まで登録・変更ができます</p></main><div class="modal-overlay hidden" id="modal"><div class="modal"><h3 id="modal-title"></h3><p id="modal-desc"></p><div class="modal-actions" id="modal-actions"></div></div></div><div class="toast" id="toast"></div><script>var D={userId:null,studentName:"",classrooms:[],schedules:{},attending:{}};var GAS="https://script.google.com/macros/s/AKfycbxwh6DVQSTEfZcbybIZR9ENaXyRMpTHk2fKcENRotPIFu6oQAEkhJFdmd11o0TONKtCGw/exec";var RO=false;var active=null, viewY=0, viewM=0, pending=null;var DOW=["日","月","火","水","木","金","土"];function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}function ymd(y,m,d){return y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);}function room(){return D.classrooms.filter(function(c){return c.id===active;})[0];}function schedMap(){var m={};(D.schedules[active]||[]).forEach(function(s){m[s.date]=s;});return m;}function markMap(){var m={};(D.attending[active]||[]).forEach(function(a){m[a.date]=a.mark;});return m;}function renderTabs(){  var h="";  D.classrooms.forEach(function(c){    h+="<button class=\"tab-btn"+(c.id===active?" active":"")+"\" style=\"--tab-color:"+esc(c.color)+"\" data-pick=\""+esc(c.id)+"\">"      +"<span class=\"tab-dot\" style=\"background:"+esc(c.color)+"\"></span>"+esc(c.name)+"</button>";  });  document.getElementById("tabs").innerHTML=h;}function renderInfo(){  var c=room(); if(!c)return;  document.getElementById("classroom-info").innerHTML=    "<div class=\"classroom-color-bar\" style=\"background:"+esc(c.color)+"\"></div>"   +"<div class=\"classroom-info-text\"><div class=\"name\">"+esc(c.name)+"</div>"   +"<div class=\"desc\">"+esc(c.description||"出席登録は授業3日前17:00まで")+"</div></div>";  document.getElementById("lg1").style.cssText="background:#fff;border:2px solid "+c.color;  document.getElementById("lg2").style.cssText="background:"+c.color;}function renderCal(){  var c=room(); var color=c?c.color:"#4a90d9";  var sm=schedMap(), mm=markMap();  document.getElementById("cal-title").textContent=viewY+"年"+(viewM+1)+"月";  var today=new Date();  var firstDow=new Date(viewY,viewM,1).getDay();  var days=new Date(viewY,viewM+1,0).getDate();  var h="";  DOW.forEach(function(d,i){h+="<div class=\"cal-day-label "+(i===0?"sun":i===6?"sat":"")+"\">"+d+"</div>";});  for(var i=0;i<firstDow;i++)h+="<div class=\"cal-cell empty\"></div>";  for(var day=1;day<=days;day++){    var ds=ymd(viewY,viewM,day);    var s=sm[ds], mk=mm[ds];    var cls="cal-cell", style="", click="", inner="<span>"+day+"</span>";    if(today.getFullYear()===viewY&&today.getMonth()===viewM&&today.getDate()===day)cls+=" today";    if(s){      style="--classroom-color:"+color;      if(s.isPast){ cls+=" class-day past"; if(mk)inner+="<span class=\"check-mark\">"+(mk==="出席"?"○":"×")+"</span>"; }      else if(s.deadlinePassed){        cls+=" class-day deadline-passed"+(mk==="出席"?" registered":mk==="欠席"?" absent":"");        if(mk)inner+="<span class=\"check-mark\">"+(mk==="出席"?"○":"×")+"</span>";      } else {        cls+=" class-day"+(mk==="出席"?" registered":mk==="欠席"?" absent":"");        if(mk)inner+="<span class=\"check-mark\">"+(mk==="出席"?"○":"×")+"</span>";        click=" data-day=\""+ds+"\"";      }    }    h+="<div class=\""+cls+"\" style=\""+style+"\""+click+">"+inner+"</div>";  }  document.getElementById("cal-grid").innerHTML=h;}function pick(id){  active=id;  var list=D.schedules[id]||[];  var future=list.filter(function(s){return !s.isPast;})[0];  var base=future?future.date:(list.length?list[list.length-1].date:null);  var t=new Date();  if(base){var p=base.split("-");viewY=+p[0];viewM=+p[1]-1;}else{viewY=t.getFullYear();viewM=t.getMonth();}  renderTabs();renderInfo();renderCal();}function mv(d){viewM+=d;if(viewM<0){viewM=11;viewY--;}else if(viewM>11){viewM=0;viewY++;}renderCal();}var WD=["日","月","火","水","木","金","土"];function openM(ds){  if(RO||!D.userId){toast("LINEのメニューから開いてください");return;}  var c=room(); var sm=schedMap()[ds]; var mk=markMap()[ds];  pending={date:ds};  var p=ds.split("-");  var w=WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()];  document.getElementById("modal-title").textContent=(+p[1])+"月"+(+p[2])+"日（"+w+"） "+c.name;  document.getElementById("modal-desc").textContent="変更は "+sm.deadlineLabel+" まで";  var st = mk==="出席" ? "<div class=\"state attend\">いま「出席」で登録されています</div>"         : mk==="欠席" ? "<div class=\"state absent\">いま「欠席」で登録されています</div>"         : "<div class=\"state\">まだ回答していません</div>";  var a = st   + "<div class=\"choice\">"   +   "<button class=\"ch ch-attend"+(mk==="出席"?" on":"")+"\" data-send=\"出席\">出席<span class=\"sub\">参加します</span></button>"   +   "<button class=\"ch ch-absent"+(mk==="欠席"?" on":"")+"\" data-send=\"欠席\">欠席<span class=\"sub\">お休みします</span></button>"   + "</div>"   + "<button class=\"btn btn-cancel\" data-close=\"1\">とじる</button>"   + (mk ? "<button class=\"linkbtn\" data-send=\"キャンセル\">回答をなかったことにする</button>" : "");  document.getElementById("modal-actions").innerHTML=a;  document.getElementById("modal").classList.remove("hidden");}function closeM(){document.getElementById("modal").classList.add("hidden");pending=null;}function send(type){
  if(!pending)return;
  var ds=pending.date; closeM(); toast("送信中…");
  jsonp({what:"attend", userId:D.userId, eventId:active+"_"+ds, type:type}, function(r){
    if(!r||!r.success){ toast("❗ "+((r&&r.message)||"登録できませんでした")); return; }
    var list=D.attending[active]||[];
    list=list.filter(function(a){return a.date!==ds;});
    if(type!=="キャンセル")list.push({date:ds,mark:type});
    D.attending[active]=list; renderCal();
    toast(type==="キャンセル"?"回答を取り消しました":type+"で登録しました ✅");
  }, function(){ toast("❗ 通信に失敗しました。もう一度お試しください"); });
}var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2600);}document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeM();});document.addEventListener("click",function(e){  var t=e.target;  while(t&&t!==document.body){    if(t.dataset){      if(t.dataset.pick!==undefined){pick(t.dataset.pick);return;}      if(t.dataset.mv!==undefined){mv(Number(t.dataset.mv));return;}      if(t.dataset.day!==undefined){openM(t.dataset.day);return;}      if(t.dataset.send!==undefined){send(t.dataset.send);return;}      if(t.dataset.close!==undefined){closeM();return;}    }    t=t.parentNode;  }});function jsonp(params, ok, ng){
  var name="cb"+Math.floor(Math.random()*1e9);
  var s=document.createElement("script");
  var q=["action=jsonp","callback="+name];
  for(var k in params){ if(params[k]!=null) q.push(k+"="+encodeURIComponent(params[k])); }
  var done=false;
  function cleanup(){ try{delete window[name];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); }
  window[name]=function(d){ done=true; cleanup(); ok(d); };
  s.onerror=function(){ if(!done){ cleanup(); if(ng)ng(); } };
  setTimeout(function(){ if(!done){ cleanup(); if(ng)ng(); } }, 25000);
  s.src=GAS+"?"+q.join("&");
  document.head.appendChild(s);
}
function loadingCell(msg,color){
  document.getElementById("cal-grid").innerHTML=
    '<div style="grid-column:1/8;text-align:center;padding:44px 0;font-size:13px;color:'+color+'">'+msg+'</div>';
}
function boot(){
  var m=location.search.match(/[?&]userId=([^&]+)/);
  var uid=m?decodeURIComponent(m[1]):null;
  loadingCell("読み込み中…","#6c6c70");
  jsonp({userId:uid}, function(d){
    D=d; D.userId=uid;
    document.getElementById("who").textContent=D.studentName?D.studentName+" さん":"";
    if(!uid){document.getElementById("notice").innerHTML="<div class=\"notice\">日程の確認ができます。<br>出欠を登録するには、LINEのメニューから開いてください。</div>";}
    if(!D.classrooms.length){ loadingCell("教室が登録されていません","#6c6c70"); return; }
    pick(D.classrooms[0].id);
  }, function(){
    loadingCell("読み込みに失敗しました<br>通信環境の良い場所で開き直してください","#ff3b30");
  });
}
boot();</script></body></html>
