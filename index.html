<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>出席登録</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       background:#f5f5f7;color:#1c1c1e;
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  .box{text-align:center;padding:24px}
  .spinner{width:36px;height:36px;margin:0 auto 16px;border:3px solid #e5e5ea;
           border-top-color:#06c755;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:14px;color:#6c6c70;line-height:1.8;margin:0}
  a.btn{display:inline-block;margin-top:16px;background:#06c755;color:#fff;text-decoration:none;
        padding:12px 24px;border-radius:12px;font-weight:700;font-size:15px}
  .err{color:#ff3b30}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="sp"></div>
  <p id="msg">出席登録を開いています…</p>
  <div id="fallback"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ============================================================
// LINE → GASカレンダー への中継ページ
//
// リッチメニューの「リンク」は全員に同じURLが配られるため、
// URLだけでは誰が押したのか分からない。
// このページがLINEに本人を尋ねてから、その人のIDを付けて
// GASのカレンダーへ送り出す。生徒さんから見ればワンタップ。
// ============================================================

// ▼ 設定（変えるのはこの2つだけ）
var LIFF_ID = '2009785365-6a6HLk42';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxwh6DVQSTEfZcbybIZR9ENaXyRMpTHk2fKcENRotPIFu6oQAEkhJFdmd11o0TONKtCGw/exec';

function go(url){ location.replace(url); }

function showError(text, linkLabel, linkUrl){
  document.getElementById('sp').style.display = 'none';
  var m = document.getElementById('msg');
  m.className = 'err';
  m.textContent = text;
  if (linkUrl) {
    document.getElementById('fallback').innerHTML =
      '<a class="btn" href="' + linkUrl + '">' + linkLabel + '</a>';
  }
}

// LINEの外（普通のブラウザ等）から開かれた場合は、
// 日程確認モードのカレンダーをそのまま見せる
function openViewOnly(){ go(GAS_URL); }

if (typeof liff === 'undefined') {
  // SDKが読めなかった（電波が悪い等）
  showError('読み込みに失敗しました。通信環境の良い場所でもう一度お試しください。',
            '日程だけ見る', GAS_URL);
} else {
  liff.init({ liffId: LIFF_ID })
    .then(function(){
      if (!liff.isLoggedIn()) { liff.login(); return; }
      return liff.getProfile().then(function(profile){
        go(GAS_URL + '?userId=' + encodeURIComponent(profile.userId));
      });
    })
    .catch(function(){
      // LINE外から開かれた場合はここに来る
      openViewOnly();
    });
}
</script>
</body>
</html>
